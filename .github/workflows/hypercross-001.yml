name: GRAFT HYPERCROSS-001 native end-to-end HOLD relay
on:
  push:
    branches:
      - graft/hypercross-001
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-cross-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GRAFT
          ref: 08f42f769f9590d78b85c8d84358e1791d5bd318
          path: donors/black-star
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GRAFT
          ref: 22a5714f25c7be59bac37b3ab691c28c1f036845
          path: donors/memento
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/free-graph
          ref: ec0ad8743c5faac3f3675760bbafcbcb1df846c1
          path: donors/free-graph
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/JAR-VIS
          ref: 35b3843c13ab1994efc913724b1db08ce79bdeed
          path: donors/jarvis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/planZ
          ref: 52183eafe0daf311582c6016b37805ae24ef4ec6
          path: donors/planz
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/CANNON
          ref: 453cf70c820a114423811cecdc70b4ec06f2675b
          path: donors/cannon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/planZ
          ref: d0bcdf7d9fc40eef59deed560057c8579a69cb2a
          path: donors/planz-garden
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/planZ
          ref: e57b227242d64d4e485540f6406ec63d21407e3c
          path: donors/planz-table
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/planZ
          ref: 1ec9a4043b150296e0d90796fae5e5cc02ba3dcc
          path: donors/planz-abundent
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/LOADOUT
          ref: 1adcb3d82f736f3ca8329c3c1d0d9eba398d49ee
          path: donors/loadout
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/GHoT
          ref: e35dd470384d864b7b0b629a68dad570875a7df0
          path: donors/ghot
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: 7016dadcafc335d7ad8dccc26f4d6e0769dcf28c
          path: donors/relatte
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/LemonPRESS
          ref: 02feb4454240d482a5e0e03258f24f8b5cc0b9f5
          path: donors/lemonpress
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only reLATTE runtime dependency
        run: npm install --prefix donors/relatte --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Static regression and source boundary checks
        run: |
          node --check src/hypercross.mjs
          node --test test/hypercross.test.mjs test/live-work.test.mjs
      - name: One actual cross-repository public synthetic question
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --question "What Waseca community grocery action can be prepared as a printable invitation?"
            --cut fixtures/early-cut.json --world same-room-a0
            --blackstar-root donors/black-star --memento-root donors/memento
            --freegraph-root donors/free-graph --jarvis-root donors/jarvis
            --planz-root donors/planz --cannon-root donors/cannon
            --planz-garden-root donors/planz-garden
            --planz-table-root donors/planz-table
            --planz-abundent-root donors/planz-abundent
            --loadout-root donors/loadout --ghot-root donors/ghot
            --relatte-root donors/relatte --lemonpress-root donors/lemonpress
          )
          node src/hypercross.mjs "${args[@]}" --output "$RUNNER_TEMP/hypercross-001" > "$RUNNER_TEMP/hypercross-cli-result.json"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const x=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'hypercross-001','hypercross-receipt.json'),'utf8'));
          assert.equal(x.schema,'graft.hypercross/v1');
          assert.equal(x.stages.length,9);
          assert.equal(x.stages[0].result,'NATIVE_VALIDATED');
          assert.equal(x.loadout.public_publish,'REFUSE');
          assert.equal(x.ghot.verified_against_local_bytes,true);
          assert.equal(x.relatte.receiver_decision,'HOLD');
          assert.equal(x.relatte.idempotent_replay,true);
          assert.equal(x.press.admission,'pending');
          assert.equal(x.people_contacted,0);
          assert.equal(x.publication,'NONE');
          process.stdout.write('HYPERCROSS_NATIVE_CHAIN_PASS: '+x.stages.map(s=>s.name+'='+s.result).join(' -> ')+'\\n');
          CHECK
      - name: A future-discovered source cannot pass Black Star and no output is created
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --question "What Waseca community grocery action can be prepared as a printable invitation?"
            --cut fixtures/future-in-early-cut.json --world same-room-a0
            --blackstar-root donors/black-star --memento-root donors/memento
            --freegraph-root donors/free-graph --jarvis-root donors/jarvis
            --planz-root donors/planz --cannon-root donors/cannon
            --planz-garden-root donors/planz-garden
            --planz-table-root donors/planz-table
            --planz-abundent-root donors/planz-abundent
            --loadout-root donors/loadout --ghot-root donors/ghot
            --relatte-root donors/relatte --lemonpress-root donors/lemonpress
          )
          if node src/hypercross.mjs "${args[@]}" --output "$RUNNER_TEMP/hypercross-should-not-exist" > "$RUNNER_TEMP/unsafe-result.json" 2>"$RUNNER_TEMP/refusal.txt"; then
            echo "DANGER: future knowledge passed" >&2; exit 1
          fi
          test ! -d "$RUNNER_TEMP/hypercross-should-not-exist"
          grep -q BLACK_STAR_VALIDATION_REFUSED "$RUNNER_TEMP/refusal.txt"
          echo "FUTURE_KNOWLEDGE_REFUSAL_PASS (zero local output)"
      - name: Export synthetic outputs for reproducible inspection
        uses: actions/upload-artifact@v4
        with:
          name: graft-hypercross-001-synthetic-hold
          path: |
            ${{ runner.temp }}/hypercross-001/kit/field-kit.html
            ${{ runner.temp }}/hypercross-001/kit/work-plan.json
            ${{ runner.temp }}/hypercross-001/kit/work-receipt.json
            ${{ runner.temp }}/hypercross-001/hypercross-receipt.json
            ${{ runner.temp }}/hypercross-001/lemonpress-candidate.json
          if-no-files-found: error
          retention-days: 7
