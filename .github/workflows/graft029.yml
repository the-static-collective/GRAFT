name: GRAFT-029 — guarded graph operator family source invention
on:
  push:
    branches:
      - graft/029-missing-operator-family
  pull_request:
    paths:
      - 'src/missing-operator-forge-029.mjs'
      - 'test/missing-operator-forge-029.test.mjs'
      - 'scripts/run-forge-029.mjs'
      - '.github/workflows/graft029.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-owned-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New operator grammar synthesis and negative fixtures
        run: node --test test/missing-operator-forge-029.test.mjs
      - name: Original GRAFT gardener and experience-memory owner regressions
        run: node --test test/capability-gardener-027.test.mjs test/experience-memory-028.test.mjs
