name: GRAFT-028 Reproducible Experience Memory
on:
  push:
    branches: [graft/028-experience-memory]
  pull_request:
    paths:
      - 'src/experience-memory-028.mjs'
      - 'test/experience-memory-028.test.mjs'
      - '.github/workflows/graft028.yml'
permissions:
  contents: read
jobs:
  replay-and-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine prior GRAFT-027 gardener regression
        run: node --test test/capability-gardener-027.test.mjs
      - name: Capture, structural retrieval, adversarial replay, privacy and HOLD
        run: node --test test/experience-memory-028.test.mjs
