name: GRAFT MEMENTO native selected code
on:
  push:
    branches:
      - graft/MEMENTO
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - run: node scripts/compile-context-pack.mjs --world same-room-a0 --depth 1
