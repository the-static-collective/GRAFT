name: WEAVES TO WEVES 001
on:
  push:
    branches:
      - graft/weaves-to-weves-001
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  local-protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest -v test_weves.py
      - name: Make nested sample and validate
        run: |
          python3 weves.py demo > weave-map.json
          python3 weves.py validate weave-map.json
          python3 weves.py trace weave-map.json
          python3 weves.py reweave weave-map.json \
            --title "Test external reweave" \
            --source-title "Independent sample" \
            --source-url "https://example.org/public/sample" \
            --source-role "new voluntary capacity" \
            --next-act "Ask an independent steward before any public invitation" \
            > reweaved-map.json
          python3 weves.py validate reweaved-map.json
      - name: Preserve reusable public sample
        uses: actions/upload-artifact@v4
        with:
          name: weaves-001-public-example
          path: |
            weave-map.json
            reweaved-map.json
          retention-days: 30
