name: UNFUTURES-001 synthetic-only specimen

on:
  push:
    branches:
      - graft/unfutures-001-possibility-exchange
  pull_request:
    paths:
      - 'unfutures/**'
      - '.github/workflows/unfutures-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic engine and replay
        run: node --test unfutures/engine.test.mjs
      - name: Run synthetic demonstration
        run: node unfutures/demo.mjs
