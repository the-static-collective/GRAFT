name: UNFUTURES-005 Dogram native mathematical witness

on:
  push:
    branches:
      - graft/unfutures-005-dogram-experiment
  pull_request:
    paths:
      - 'unfutures/**'
      - '.github/workflows/unfutures-005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogram:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout GRAFT experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout the ORIGINAL exact-pinned Dogram source
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: 551b5f9df18f17ec69b452ddcdff01718e0ff771
          path: vendor_dogram
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact Dogram source SHA
        run: |
          test "$(git -C vendor_dogram rev-parse HEAD)" = "551b5f9df18f17ec69b452ddcdff01718e0ff771"
      - name: Run 001-004 regression tests
        run: node --test unfutures/engine.test.mjs unfutures/reactor.test.mjs unfutures/generator.test.mjs unfutures/imagination.test.mjs
      - name: Run 005 contract and mathematical projection tests
        run: node --test unfutures/experiment.test.mjs
      - name: Export bounded, predeclared synthetic experiment
        run: |
          mkdir -p out
          node unfutures/experiment-demo.mjs specimens > out/experiment-specimens.json
          node unfutures/experiment-demo.mjs summary > out/experiment-summary.json
          node unfutures/experiment-demo.mjs trial > out/manual-jarvis-trial-candidate.json
      - name: Run original pinned Dogram native calculator
        env:
          PYTHONPATH: vendor_dogram
          UNFUTURES_DOGRAM_PIN: 551b5f9df18f17ec69b452ddcdff01718e0ff771
        run: |
          python3 unfutures/verify_dogram.py out/experiment-specimens.json out/dogram-native-receipts.json
      - name: Package offline exploration surface
        run: cp unfutures/experiment-board.html out/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: UNFUTURES-005-Dogram-native-math-lab
          path: out/
          if-no-files-found: error
          retention-days: 14
